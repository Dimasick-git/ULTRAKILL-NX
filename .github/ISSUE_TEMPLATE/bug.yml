name: Баг или вылет
description: Ошибка при запуске, на уровне или в управлении
title: "[Bug] "
body:
  - type: input
    id: build
    attributes:
      label: Версия сборки
      placeholder: r1 / r32
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Консоль и тестовое окружение
      description: Модель/SoC Switch, HOS, Atmosphère и релиз Ryzhenka; handheld/docked; версия и активный профиль Ryazha-clk, фактические CPU/GPU/RAM clocks и изменённые вольтажи/тайминги (если известны); SaltyNX/FSR-NX; FSR и render_height. Неизвестные данные отметь как неизвестные. См. docs/TEST_ENVIRONMENT.md.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Что произошло
      description: Уровень, действие перед ошибкой, как повторить и что ожидалось.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Журнал и скриншоты
      description: Приложи switch/ultrakill/debug.log, SaltySD/saltynx.log и свежий файл из atmosphere/crash_reports, если он есть. Логи нужно скопировать с microSD после закрытия игры и до следующего запуска.
